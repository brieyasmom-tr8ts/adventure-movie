<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Choose Your Adventure</title>
<style>
/* ---------- Design tokens ---------- */
:root{
  --bg-1:#08080f;--bg-2:#12121e;--bg-3:#1a1a2c;
  --gold:#ffd200;--gold-2:#f7971e;--gold-soft:rgba(255,210,0,0.18);
  --text-1:#fff;--text-2:#cdd1e0;--text-3:#7a7f90;
  --border:rgba(255,255,255,0.08);--border-2:rgba(255,255,255,0.16);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:#000;color:var(--text-2);
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
}
.screen{display:none;position:fixed;inset:0;flex-direction:column}
.screen.active{display:flex}

/* ---------- Always-on layers ---------- */
.vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,0.55) 100%);pointer-events:none;z-index:200}

/* ---------- Top bar ---------- */
.top-bar{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:230;display:flex;gap:8px}
.top-btn{
  background:rgba(0,0,0,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border-2);color:#fff;
  width:42px;height:42px;border-radius:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  transition:transform 0.15s,background 0.2s,border-color 0.2s;
}
.top-btn:hover{background:rgba(255,210,0,0.2);border-color:var(--gold)}
.top-btn:active{transform:scale(0.92)}
.top-btn.on{background:rgba(255,210,0,0.18);border-color:var(--gold)}
.top-back{display:none;position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:230}
body[data-screen="player-screen"] .top-back,body[data-screen="ending-screen"] .top-back{display:flex}

/* ---------- Home screen ---------- */
#home-screen{
  background:
    radial-gradient(ellipse 100% 80% at 50% 0%,rgba(247,151,30,0.12),transparent 60%),
    linear-gradient(180deg,var(--bg-3) 0%,var(--bg-1) 60%);
  padding:0;overflow-y:auto;align-items:stretch;
}
.home-hero{padding:64px 24px 16px;text-align:center}
.home-title{font-size:46px;font-weight:900;color:#fff;line-height:1.05;letter-spacing:-1px;margin-bottom:8px;margin-top:8px}
.home-title span{background:linear-gradient(135deg,var(--gold-2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-sub{color:var(--text-3);font-size:15px;margin-bottom:24px;letter-spacing:0.3px}

.mode-pill{display:inline-flex;background:rgba(255,255,255,0.04);border:1px solid var(--border-2);border-radius:999px;padding:3px;margin:0 auto;gap:2px}
.mode-pill button{background:transparent;border:none;color:var(--text-3);padding:7px 16px;font-size:11px;font-weight:800;border-radius:999px;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:1.3px;transition:background 0.2s,color 0.2s}
.mode-pill button.active{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#111}

#categories-wrap{padding:20px 0 80px}
.category-section{margin-bottom:28px}
.category-title{color:#fff;font-size:18px;font-weight:800;margin-bottom:12px;padding:0 24px;letter-spacing:-0.2px}
.category-title::after{content:'';display:inline-block;width:24px;height:1px;background:var(--gold);margin-left:10px;vertical-align:middle;opacity:0.5}

/* Netflix-style horizontal poster row */
.story-grid{
  display:flex;gap:14px;
  overflow-x:auto;overflow-y:visible;
  padding:6px 24px 16px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.story-grid::-webkit-scrollbar{display:none}

.story-card{
  position:relative;flex:0 0 168px;height:236px;
  border-radius:16px;overflow:hidden;
  background-size:cover;background-position:center;background-color:var(--bg-2);
  cursor:pointer;border:1px solid var(--border);
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
  transition:transform 0.25s cubic-bezier(0.2,0.9,0.3,1.2),box-shadow 0.3s,border-color 0.3s;
  scroll-snap-align:start;
}
.story-card:hover{transform:translateY(-6px) scale(1.04);box-shadow:0 16px 44px rgba(0,0,0,0.6),0 0 0 1px var(--gold-soft);border-color:var(--gold)}
.story-card:active{transform:scale(0.97)}

.card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.45) 0%,transparent 35%,rgba(0,0,0,0.95) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.card-emoji{position:absolute;top:14px;right:12px;font-size:22px;opacity:0.92;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6));z-index:2}
.card-theme{font-size:9.5px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;font-weight:800;margin-bottom:4px;text-shadow:0 2px 6px rgba(0,0,0,0.5)}
.card-title{color:#fff;font-size:15px;font-weight:800;line-height:1.2;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,0.7)}
.card-progress{font-size:10.5px;color:var(--text-2);letter-spacing:0.3px;opacity:0.95;text-shadow:0 1px 4px rgba(0,0,0,0.7)}
.card-progress.complete{color:#7fffa1}
.card-badge{position:absolute;top:10px;left:10px;background:rgba(127,255,161,0.22);border:1px solid #7fffa1;color:#7fffa1;font-size:9px;padding:3px 7px;border-radius:6px;font-weight:800;backdrop-filter:blur(8px);z-index:2;letter-spacing:0.5px}
.card-ai-tag{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#111;font-size:10px;padding:3px 7px;border-radius:6px;font-weight:800;z-index:2;box-shadow:0 4px 14px rgba(255,210,0,0.35);letter-spacing:0.3px}

/* ---------- Player screen ---------- */
#player-screen{background:#000}

.scene-image{position:absolute;inset:0;z-index:1;overflow:hidden;background:#000}
.scene-image img,.scene-image video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:heroZoom 18s ease-out forwards}
@keyframes heroZoom{from{transform:scale(1.02)}to{transform:scale(1.16)}}
.scene-image-overlay{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 30%,transparent 25%,rgba(0,0,0,0.4) 80%,rgba(0,0,0,0.85) 100%),
    linear-gradient(180deg,rgba(0,0,0,0.45) 0%,transparent 25%,transparent 42%,rgba(8,8,15,0.88) 76%,rgba(8,8,15,0.99) 100%);
}

.letterbox{position:fixed;left:0;right:0;height:18px;background:#000;z-index:25;pointer-events:none}
.letterbox.top{top:0}
.letterbox.bottom{bottom:0}

.timer-track{position:absolute;top:18px;left:0;right:0;height:3px;background:rgba(255,255,255,0.08);z-index:20}
.timer-fill{height:100%;background:linear-gradient(90deg,#7fffa1 0%,var(--gold-2) 60%,var(--gold) 100%);transition:width 0.95s linear;box-shadow:0 0 10px rgba(255,210,0,0.5)}
.timer-fill.warn{background:linear-gradient(90deg,#ff5050,#ff7878);animation:pulseWarn 0.6s infinite;box-shadow:0 0 14px rgba(255,80,80,0.7)}
@keyframes pulseWarn{50%{opacity:0.55}}

.scene-body{
  position:absolute;left:0;right:0;bottom:18px;
  max-height:64vh;
  background:linear-gradient(180deg,rgba(8,8,15,0.0) 0%,rgba(8,8,15,0.85) 18%,rgba(8,8,15,0.96) 60%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:32px 22px 26px;
  overflow-y:auto;
  display:flex;flex-direction:column;
  z-index:10;
}
.scene-chapter{
  display:inline-block;align-self:flex-start;
  font-size:10.5px;text-transform:uppercase;letter-spacing:3.5px;
  color:var(--gold);font-weight:800;
  background:rgba(255,210,0,0.08);border:1px solid rgba(255,210,0,0.25);
  padding:6px 12px;border-radius:999px;margin-bottom:16px;
}
.scene-chapter:empty{display:none}
.scene-text{font-size:19px;line-height:1.65;color:var(--text-1);margin-bottom:24px;flex:1;cursor:pointer;min-height:1.65em;font-weight:400;letter-spacing:0.1px}
.scene-text .caret{display:inline-block;width:2px;background:var(--gold);animation:blink 1s steps(2) infinite;margin-left:2px;vertical-align:text-bottom;height:1em;border-radius:1px}
@keyframes blink{50%{opacity:0}}

.choices-wrap{display:flex;flex-direction:column;gap:10px;transition:opacity 0.25s}
.choices-wrap.hidden{opacity:0;pointer-events:none}

.choice-btn{
  position:relative;
  padding:16px 44px 16px 18px;
  background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
  border:1.5px solid var(--border-2);
  border-radius:14px;
  color:#fff;font-size:16px;text-align:left;
  cursor:pointer;display:flex;align-items:center;gap:12px;
  font-family:inherit;font-weight:500;line-height:1.35;
  transition:transform 0.12s,background 0.25s,border-color 0.25s,box-shadow 0.25s;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.choice-btn::after{content:'›';position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:22px;font-weight:300;line-height:1;opacity:0.5;transition:opacity 0.2s,transform 0.2s}
.choice-btn:hover{background:linear-gradient(135deg,rgba(255,210,0,0.18),rgba(255,210,0,0.06));border-color:var(--gold);box-shadow:0 8px 28px rgba(255,210,0,0.18)}
.choice-btn:hover::after{opacity:1;transform:translateY(-50%) translateX(4px)}
.choice-btn:active{transform:scale(0.97);background:linear-gradient(135deg,rgba(255,210,0,0.28),rgba(255,210,0,0.12))}
.choice-key{width:32px;height:32px;border-radius:9px;background:rgba(0,0,0,0.6);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;color:var(--gold);box-shadow:0 0 12px rgba(255,210,0,0.18) inset}

/* Interactive input */
.interactive-input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.07);border:1.5px solid var(--border-2);border-radius:14px;color:#fff;font-size:16px;font-family:inherit;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
.interactive-input:focus{border-color:var(--gold);background:rgba(255,255,255,0.12);box-shadow:0 0 0 4px rgba(255,210,0,0.1)}
.interactive-submit{margin-top:10px;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#111;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:transform 0.1s,box-shadow 0.2s;box-shadow:0 8px 24px rgba(255,210,0,0.3)}
.interactive-submit:active{transform:scale(0.97)}
.interactive-hint{color:var(--text-3);font-size:12px;margin-top:8px;text-align:center}
.ai-response{margin-top:16px;padding:14px;background:rgba(255,210,0,0.08);border-left:3px solid var(--gold);border-radius:8px;color:var(--text-1);font-size:15px;line-height:1.5;font-style:italic}

/* WWYD overlay */
.wwyd-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;pointer-events:none;transition:opacity 0.4s}
.wwyd-overlay.active{opacity:1;pointer-events:auto}
.wwyd-text{font-size:36px;font-weight:900;color:#fff;text-align:center;padding:0 24px;letter-spacing:-0.5px;transform:scale(0.9);transition:transform 0.4s}
.wwyd-overlay.active .wwyd-text{transform:scale(1)}
.wwyd-text span{background:linear-gradient(135deg,var(--gold-2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Scene fade */
.scene-fade{transition:opacity 0.4s ease}
.scene-fade.fading{opacity:0}

/* AI loading */
.ai-loading{position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:350;opacity:0;pointer-events:none;transition:opacity 0.35s}
.ai-loading.active{opacity:1;pointer-events:auto}
.ai-loading-label{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:6px;margin-bottom:24px;font-weight:800}
.ai-loading-bar{width:240px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;position:relative}
.ai-loading-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:shimmer 1.4s infinite linear}
@keyframes shimmer{from{background-position:-50% 0}to{background-position:150% 0}}
.ai-loading-hint{color:var(--text-3);font-size:12px;margin-top:18px;letter-spacing:1px}

/* AI error */
.ai-error{padding:18px;background:rgba(255,80,80,0.08);border:1.5px solid rgba(255,120,120,0.4);border-radius:14px;color:#fff;margin-bottom:10px}
.ai-error strong{display:block;color:#ff8e8e;margin-bottom:6px;font-size:15px}
.ai-error-msg{color:var(--text-2);font-size:13px;line-height:1.5;margin-bottom:12px;word-break:break-word}

/* ---------- Ending screen ---------- */
#ending-screen{
  background:
    radial-gradient(ellipse at top,rgba(255,210,0,0.1) 0%,transparent 55%),
    linear-gradient(180deg,var(--bg-3) 0%,var(--bg-1) 70%);
  align-items:center;justify-content:flex-start;
  padding:72px 24px 40px;overflow-y:auto;
}
.ending-wrap{max-width:520px;width:100%;text-align:center}
.ending-emoji{font-size:96px;margin-bottom:16px;filter:drop-shadow(0 0 28px rgba(255,210,0,0.45));animation:emojiReveal 0.8s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes emojiReveal{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.ending-type{font-size:11px;text-transform:uppercase;letter-spacing:5px;color:var(--gold);margin-bottom:10px;font-weight:800;animation:fadeUp 0.5s 0.1s both}
.ending-title{
  font-size:38px;font-weight:900;
  margin-bottom:14px;line-height:1.05;letter-spacing:-0.8px;
  background:linear-gradient(180deg,#fff 60%,#cdd1e0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:fadeUp 0.6s 0.2s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ending-progress{font-size:12px;color:#7fffa1;margin-bottom:18px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;animation:fadeUp 0.6s 0.3s both}
.ending-text{font-size:17px;line-height:1.65;color:var(--text-2);margin-bottom:28px;animation:fadeUp 0.6s 0.4s both}
.ending-lesson{
  background:linear-gradient(135deg,rgba(255,210,0,0.12),rgba(247,151,30,0.05));
  border:1.5px solid rgba(255,210,0,0.4);border-radius:18px;padding:20px;
  margin-bottom:32px;text-align:left;
  box-shadow:0 12px 40px rgba(255,210,0,0.12);
  animation:fadeUp 0.6s 0.5s both;
}
.ending-lesson-label{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:var(--gold);margin-bottom:8px;font-weight:800}
.ending-lesson-text{font-size:16.5px;color:#fff;line-height:1.55;font-weight:500}
.reflect-title{font-size:11px;text-transform:uppercase;letter-spacing:3px;color:var(--gold);margin-bottom:14px;font-weight:800;animation:fadeUp 0.6s 0.6s both}
.reflect-list{list-style:none;margin-bottom:32px;text-align:left;display:flex;flex-direction:column;gap:8px;animation:fadeUp 0.6s 0.7s both}
.reflect-list li{
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px 14px 48px;
  color:var(--text-2);font-size:15px;line-height:1.5;
  position:relative;transition:background 0.2s,border-color 0.2s;
}
.reflect-list li:hover{background:rgba(255,210,0,0.06);border-color:rgba(255,210,0,0.25)}
.reflect-list li::before{
  content:'?';position:absolute;left:14px;top:14px;
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#111;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;
}
.ending-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;animation:fadeUp 0.6s 0.8s both}
.end-btn{padding:14px 22px;border-radius:12px;font-size:14px;font-weight:800;border:none;cursor:pointer;font-family:inherit;letter-spacing:0.3px;transition:transform 0.1s,box-shadow 0.2s,background 0.2s}
.end-btn:active{transform:scale(0.96)}
.end-btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#111;box-shadow:0 8px 28px rgba(255,210,0,0.35)}
.end-btn.primary:hover{box-shadow:0 12px 38px rgba(255,210,0,0.5)}
.end-btn.secondary{background:rgba(255,255,255,0.06);color:var(--text-2);border:1px solid var(--border-2);backdrop-filter:blur(6px)}
.end-btn.secondary:hover{background:rgba(255,255,255,0.12);color:#fff;border-color:var(--gold)}

/* Mobile */
@media(max-width:400px){
  .home-title{font-size:38px}
  .scene-text{font-size:17px}
  .wwyd-text{font-size:28px}
  .ending-title{font-size:30px}
  .ending-emoji{font-size:80px}
  .story-card{flex-basis:148px;height:212px}
  .home-hero{padding:52px 20px 12px}
}
</style>
</head>
<body data-screen="home-screen">

<div class="vignette"></div>

<button class="top-btn top-back" onclick="goHome()" title="Back to stories" aria-label="Back to stories">←</button>
<div class="top-bar">
  <button class="top-btn on" id="sound-toggle" onclick="toggleSound()" title="Sound on/off">🔊</button>
</div>

<div id="home-screen" class="screen active">
  <div class="home-hero">
    <div class="home-title">Choose Your<br><span>Adventure</span></div>
    <p class="home-sub">Step into the story. Every choice matters.</p>
    <div class="mode-pill" role="group" aria-label="Mode">
      <button id="mode-story" class="active" onclick="setMode('story')">Story Mode</button>
      <button id="mode-reflect" onclick="setMode('reflect')">Reflection Mode</button>
    </div>
  </div>
  <div id="categories-wrap"></div>
</div>

<div id="player-screen" class="screen">
  <div class="letterbox top"></div>
  <div class="scene-image" id="scene-image-wrap">
    <img id="scene-img" src="" alt="">
    <video id="scene-video" muted loop playsinline style="display:none"></video>
    <div class="scene-image-overlay"></div>
  </div>
  <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
  <div class="scene-body scene-fade" id="scene-body">
    <div class="scene-chapter" id="scene-chapter"></div>
    <div class="scene-text" id="scene-text" onclick="skipTypewriter()"></div>
    <div class="choices-wrap" id="choices-wrap"></div>
  </div>
  <div class="letterbox bottom"></div>
</div>

<div id="ending-screen" class="screen">
  <div class="ending-wrap">
    <div class="ending-emoji" id="ending-emoji"></div>
    <div class="ending-type" id="ending-type"></div>
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-progress" id="ending-progress"></div>
    <div class="ending-text" id="ending-text"></div>
    <div class="ending-lesson">
      <div class="ending-lesson-label">Life Lesson</div>
      <div class="ending-lesson-text" id="ending-lesson"></div>
    </div>
    <div class="reflect-title">Think About It</div>
    <ul class="reflect-list" id="reflect-list"></ul>
    <div class="ending-actions">
      <button class="end-btn primary" onclick="restartStory()">Replay from beginning</button>
      <button class="end-btn secondary" onclick="tryDifferentPath()">Try a different path</button>
      <button class="end-btn secondary" onclick="goHome()">All Stories</button>
    </div>
  </div>
</div>

<div class="wwyd-overlay" id="wwyd-overlay">
  <div class="wwyd-text">What would <span>YOU</span> do?</div>
</div>

<div class="ai-loading" id="ai-loading">
  <div class="ai-loading-label">The story unfolds</div>
  <div class="ai-loading-bar"></div>
  <div class="ai-loading-hint">Claude is writing your next scene…</div>
</div>

<script>
/* =========================================================
   STORIES — grouped by category
   Scene types:
   - Branching:        { chapter, text, image|video, mood, choices:[{text,next}] }
   - Ending:           { ending:true, type, emoji, title, text, lesson, reflect[] }
   - Interactive:      { interactive:true, chapter, text, image, prompt, next }
   - AI handoff:       any choice with next:"ai" hands the next scene to Claude.
                       Story-level seed:{tone,lesson} steers the AI.
   ========================================================= */
const STORIES=[
{id:"crossroads",title:"The Crossroads",theme:"Choose Your Path",emoji:"✨",category:"AI Adventures",aiStory:true,image:"https://images.unsplash.com/photo-1448375240586-882707db888b?w=800&q=80",seed:{tone:"cinematic, sensory, present-tense, ages 10+, emotionally honest",lesson:"the meaning of the journey emerges from the choices the player actually makes"},scenes:{

/* =========================================================
   AUDIO — Web Audio API (no external assets)
   ========================================================= */
let audioCtx=null;
let musicNodes=null;
let currentMood=null;

function ensureAudio(){
  if(audioCtx)return audioCtx;
  try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
  return audioCtx;
}
function stopMusic(){
  if(!musicNodes)return;
  try{musicNodes.forEach(n=>{try{n.stop&&n.stop();n.disconnect&&n.disconnect();}catch(e){}});}catch(e){}
  musicNodes=null;
}
function playMusic(mood){
  if(!soundOn){stopMusic();currentMood=null;return;}
  if(currentMood===mood)return;
  currentMood=mood;
  stopMusic();
  const ctx=ensureAudio();if(!ctx)return;
  if(ctx.state==='suspended')ctx.resume();
  const master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  master.gain.linearRampToValueAtTime(0.08,ctx.currentTime+1.5);
  const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=mood==='tension'?900:mood==='victory'?2400:1400;filter.connect(master);
  const freqs=mood==='tension'?[55,82.4,110]:mood==='victory'?[130.8,164.8,196,261.6]:[110,164.8,220];
  const oscs=freqs.map((f,i)=>{
    const o=ctx.createOscillator();o.type=mood==='victory'?'triangle':'sine';o.frequency.value=f;
    const g=ctx.createGain();g.gain.value=0.5/(i+1);
    const lfo=ctx.createOscillator();lfo.frequency.value=0.1+i*0.07;
    const lfoGain=ctx.createGain();lfoGain.gain.value=mood==='tension'?2:1;
    lfo.connect(lfoGain);lfoGain.connect(o.frequency);
    o.connect(g);g.connect(filter);
    o.start();lfo.start();
    return [o,lfo];
  }).flat();
  musicNodes=[master,filter,...oscs];
}
function playSfx(type){
  if(!soundOn)return;
  const ctx=ensureAudio();if(!ctx)return;
  if(ctx.state==='suspended')ctx.resume();
  const o=ctx.createOscillator();const g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);
  const t=ctx.currentTime;
  if(type==='click'){o.type='triangle';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(400,t+0.08);g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.start(t);o.stop(t+0.13);}
  else if(type==='warn'){o.type='square';o.frequency.value=1200;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.12,t+0.02);g.gain.linearRampToValueAtTime(0.0001,t+0.18);o.start(t);o.stop(t+0.2);}
  else if(type==='reveal'){
    [261.6,329.6,392,523.2].forEach((f,i)=>{
      const oo=ctx.createOscillator();const gg=ctx.createGain();
      oo.type='triangle';oo.frequency.value=f;
      oo.connect(gg);gg.connect(ctx.destination);
      const start=t+i*0.12;
      gg.gain.setValueAtTime(0.0001,start);gg.gain.linearRampToValueAtTime(0.18,start+0.03);gg.gain.exponentialRampToValueAtTime(0.0001,start+0.5);
      oo.start(start);oo.stop(start+0.55);
    });
  }
}

/* =========================================================
   SOUND TOGGLE + MODE
   ========================================================= */
function toggleSound(){
  soundOn=!soundOn;
  localStorage.setItem('am_sound',soundOn?'on':'off');
  const btn=document.getElementById('sound-toggle');
  btn.textContent=soundOn?'🔊':'🔇';
  btn.classList.toggle('on',soundOn);
  if(!soundOn){stopMusic();currentMood=null;}
  else if(currentStory&&currentSceneId){
    const s=currentStory.scenes[currentSceneId];
    if(s)playMusic(s.mood||'calm');
  }
}
function setMode(m){
  mode=m;
  localStorage.setItem('am_mode',m);
  document.getElementById('mode-story').classList.toggle('active',m==='story');
  document.getElementById('mode-reflect').classList.toggle('active',m==='reflect');
}

/* =========================================================
   PROGRESS TRACKING (localStorage)
   ========================================================= */
function loadProgress(){
  try{return JSON.parse(localStorage.getItem('am_progress')||'{}');}catch(e){return {};}
}
function saveProgress(){
  localStorage.setItem('am_progress',JSON.stringify(progress));
}
function recordEnding(storyId,endingId){
  if(!progress[storyId])progress[storyId]={endings:[]};
  if(!progress[storyId].endings.includes(endingId))progress[storyId].endings.push(endingId);
  saveProgress();
}
function endingCount(story){
  return Object.keys(story.scenes).filter(k=>story.scenes[k].ending).length;
}
function discoveredCount(storyId){
  return progress[storyId]?progress[storyId].endings.length:0;
}

/* =========================================================
   HOME — grouped by category
   ========================================================= */
function buildHome(){
  const wrap=document.getElementById('categories-wrap');
  const cats={};
  STORIES.forEach(s=>{(cats[s.category]=cats[s.category]||[]).push(s);});
  const order=['AI Adventures','Bible','Leadership','Life Decisions','Teen / Social'];
  const sortedCats=Object.keys(cats).sort((a,b)=>{
    const ai=order.indexOf(a),bi=order.indexOf(b);
    return (ai===-1?99:ai)-(bi===-1?99:bi);
  });
  wrap.innerHTML=sortedCats.map(cat=>{
    const cards=cats[cat].map(s=>{
      const total=endingCount(s);
      const found=discoveredCount(s.id);
      const isAI=!!s.aiStory;
      const complete=!isAI&&found>=total&&total>0;
      // AI tag and Complete badge share the top-left slot — AI stories never reach "complete".
      const cornerTag=isAI?'<div class="card-ai-tag">✨ AI</div>':(complete?'<div class="card-badge">✓ COMPLETE</div>':'');
      let prog='';
      if(isAI){
        prog=`<div class="card-progress">${found} ${found===1?'path':'paths'} explored</div>`;
      }else if(total>0){
        prog=`<div class="card-progress${complete?' complete':''}">${found}/${total} endings</div>`;
      }
      const bg=s.image?`style="background-image:url('${s.image}')"`:'';
      return `<div class="story-card" ${bg} onclick="startStory('${s.id}')">${cornerTag}<div class="card-emoji">${s.emoji}</div><div class="card-overlay"><div class="card-theme">${s.theme}</div><div class="card-title">${s.title}</div>${prog}</div></div>`;
    }).join('');
    return `<div class="category-section"><div class="category-title">${cat}</div><div class="story-grid">${cards}</div></div>`;
  }).join('');
}

/* =========================================================
   SCREEN MGMT
   ========================================================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.body.dataset.screen=id;
}

function startStory(id){
  currentStory=STORIES.find(s=>s.id===id);
  if(!currentStory)return;
  visitedScenes=[];journey=[];currentAIScene=null;
  showScreen('player-screen');
  playScene('s1');
}
function restartStory(){
  if(!currentStory)return;
  visitedScenes=[];journey=[];currentAIScene=null;
  showScreen('player-screen');
  playScene('s1');
}
function tryDifferentPath(){
  if(!currentStory)return;
  visitedScenes=[];journey=[];currentAIScene=null;
  showScreen('player-screen');
  playScene('s1');
}
function goHome(){
  if(timerInterval)clearInterval(timerInterval);
  stopMusic();currentMood=null;
  hideAILoading();
  buildHome();
  showScreen('home-screen');
}

   SCENE PLAYBACK
   ========================================================= */
function playScene(id){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  const s=currentStory.scenes[id];
  if(!s)return;
  currentSceneId=id;
  visitedScenes.push(id);

  if(s.ending){showEnding(s,id);return;}
  playMusic(s.mood||'calm');

  const body=document.getElementById('scene-body');
  body.classList.add('fading');

  setTimeout(()=>{
    // Image vs video
    const imgEl=document.getElementById('scene-img');
    const videoEl=document.getElementById('scene-video');
    if(s.video){
      videoEl.src=s.video;videoEl.style.display='block';imgEl.style.display='none';
      videoEl.play().catch(()=>{});
    }else{
      imgEl.src=s.image||currentStory.image;imgEl.style.display='block';videoEl.style.display='none';
      try{videoEl.pause();}catch(e){}
    }
    // Force restart of zoom animation
    const wrap=document.getElementById('scene-image-wrap');
    const visual=s.video?videoEl:imgEl;
    visual.style.animation='none';void visual.offsetWidth;visual.style.animation='';

    document.getElementById('scene-chapter').textContent=s.chapter||'';
    document.querySelector('.scene-body').scrollTop=0;

    if(s.interactive){
      renderInteractive(s);
    }else{
      renderBranching(s);
    }
    body.classList.remove('fading');
  },300);
}

function renderBranching(s){
  const choicesWrap=document.getElementById('choices-wrap');
  choicesWrap.classList.remove('hidden');
  const keys=['A','B','C','D'];
  choicesWrap.innerHTML=s.choices.map((c,i)=>
    `<button class="choice-btn" onclick="choose('${c.next}')"><span class="choice-key">${keys[i]}</span>${c.text}</button>`
  ).join('');
  startTypewriter(s.text);
  startTimer(s.choices[0].next);
}

function renderInteractive(s){
  const choicesWrap=document.getElementById('choices-wrap');
  choicesWrap.classList.remove('hidden');
  choicesWrap.innerHTML=`
    <input class="interactive-input" id="ai-input" placeholder="${(s.prompt||'What would you do?').replace(/"/g,'&quot;')}" autocomplete="off">
    <button class="interactive-submit" onclick="submitInteractive('${s.next}')">Continue →</button>
    <div class="interactive-hint">Your answer is just for you. No data is sent anywhere.</div>
    <div id="ai-response-slot"></div>
  `;
  startTypewriter(s.text||s.prompt||'What would you do?');
  // No countdown timer for interactive scenes
  document.getElementById('timer-fill').style.width='0%';
  setTimeout(()=>{const i=document.getElementById('ai-input');i&&i.focus();},400);
}

async function submitInteractive(nextId){
  const input=document.getElementById('ai-input');
  if(!input)return;
  const val=input.value.trim();
  if(!val){input.focus();return;}
  playSfx('click');
  const slot=document.getElementById('ai-response-slot');
  slot.innerHTML=`<div class="ai-response">Thinking…</div>`;
  const reply=await generateAIResponse(val,{storyId:currentStory.id,sceneId:currentSceneId});
  slot.innerHTML=`<div class="ai-response">${reply}</div>`;
  setTimeout(()=>choose(nextId),1500);
}

/* =========================================================
   AI LAYER
   - generateAIResponse(input, ctx): used by interactive scenes
     for a one-line acknowledgement (mock; could call /api/generate later).
   - generateAIScene():               full live scene generation,
     posts the story seed + journey to the Pages Function /api/generate.
   ========================================================= */
async function generateAIResponse(input,context){
  // Lightweight mock for interactive ack — keeps interactive scenes feeling alive
  // without burning a full AI call.
  await new Promise(r=>setTimeout(r,600));
  const mocks=[
    "Interesting choice. That says a lot about how you handle pressure.",
    "Most people don't think to do that. The story remembers.",
    "There's wisdom in that. Let's see where it leads.",
    "A bold answer. The next scene will weigh it."
  ];
  return mocks[Math.floor(Math.random()*mocks.length)];
}

function buildSeed(story){
  return {
    title:story.title,
    theme:story.theme,
    category:story.category,
    tone:(story.seed&&story.seed.tone)||'cinematic, present-tense, ages 10+',
    lesson:(story.seed&&story.seed.lesson)||''
  };
}

async function generateAIScene(){
  if(aiBusy)return;
  aiBusy=true;
  showAILoading();
  const seed=buildSeed(currentStory);
  const cacheKey='aiscene:'+currentStory.id+':'+simpleHash(JSON.stringify(journey));
  let scene=aiCacheGet(cacheKey);
  if(!scene){
    try{
      const resp=await fetch('/api/generate',{
        method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({seed,history:journey})
      });
      const data=await resp.json().catch(()=>({error:'Invalid JSON from server'}));
      if(!resp.ok){
        aiBusy=false;
        showAIError(data.error||('HTTP '+resp.status),data.detail);
        return;
      }
      scene=data.scene;
      if(!scene){
        aiBusy=false;
        showAIError('Empty scene returned',JSON.stringify(data));
        return;
      }
      aiCacheSet(cacheKey,scene);
    }catch(e){
      aiBusy=false;
      showAIError('Network error',String(e));
      return;
    }
  }
  aiBusy=false;
  hideAILoading();
  renderAIScene(scene);
}

function renderAIScene(scene){
  currentAIScene=scene;
  currentSceneId='ai_'+(journey.length);

  if(scene.ending){
    showEnding(scene,currentSceneId);
    return;
  }

  playMusic(scene.mood||'calm');

  const body=document.getElementById('scene-body');
  body.classList.add('fading');

  setTimeout(()=>{
    // AI scenes reuse the story's hero image (no AI image generation here).
    const imgEl=document.getElementById('scene-img');
    const videoEl=document.getElementById('scene-video');
    imgEl.src=currentStory.image;
    imgEl.style.display='block';
    videoEl.style.display='none';
    try{videoEl.pause();}catch(e){}
    imgEl.style.animation='none';void imgEl.offsetWidth;imgEl.style.animation='';

    document.getElementById('scene-chapter').textContent=scene.chapter||'';
    document.querySelector('.scene-body').scrollTop=0;

    const choicesWrap=document.getElementById('choices-wrap');
    choicesWrap.classList.remove('hidden');
    const keys=['A','B','C','D'];
    const choices=(scene.choices||[]).slice(0,4);
    choicesWrap.innerHTML=choices.map((c,i)=>
      `<button class="choice-btn" onclick="chooseAI(${i})"><span class="choice-key">${keys[i]}</span>${escapeHtml(c.text)}</button>`
    ).join('');

    startTypewriter(scene.text||'');
    // Timer auto-picks first AI choice on timeout.
    aiAutoTimer();

    body.classList.remove('fading');
  },300);
}

function aiAutoTimer(){
  let rem=TIMER_SECONDS;
  timerWarned=false;
  const fill=document.getElementById('timer-fill');
  fill.classList.remove('warn');
  fill.style.width='100%';
  timerInterval=setInterval(()=>{
    rem--;
    fill.style.width=(rem/TIMER_SECONDS*100)+'%';
    if(rem<=5&&!timerWarned){timerWarned=true;fill.classList.add('warn');playSfx('warn');}
    if(rem<=0){
      clearInterval(timerInterval);timerInterval=null;
      chooseAI(0);
    }
  },1000);
}

function showAILoading(){document.getElementById('ai-loading').classList.add('active');}
function hideAILoading(){document.getElementById('ai-loading').classList.remove('active');}

function showAIError(msg,detail){
  hideAILoading();
  const choicesWrap=document.getElementById('choices-wrap');
  choicesWrap.classList.remove('hidden');
  const detailHtml=detail?`<div class="ai-error-msg">${escapeHtml(String(detail).slice(0,300))}</div>`:'';
  choicesWrap.innerHTML=`
    <div class="ai-error">
      <strong>The storyteller is unavailable.</strong>
      <div class="ai-error-msg">${escapeHtml(msg||'Unknown error')}</div>
      ${detailHtml}
    </div>
    <button class="choice-btn" onclick="generateAIScene()"><span class="choice-key">↻</span>Try again</button>
    <button class="choice-btn" onclick="goHome()"><span class="choice-key">←</span>Back to stories</button>
  `;
}

/* =========================================================
   AI CACHE — sessionStorage keyed by story id + journey hash
   ========================================================= */
function simpleHash(s){
  let h=0;
  for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
  return h.toString(36);
}
function aiCacheGet(key){
  try{const v=sessionStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}
}
function aiCacheSet(key,val){
  try{sessionStorage.setItem(key,JSON.stringify(val));}catch(e){}
}

/* =========================================================
   TYPEWRITER
   ========================================================= */
function startTypewriter(fullText){
  const el=document.getElementById('scene-text');
  typewriterFull=fullText||'';
  if(typewriterTimeout){clearTimeout(typewriterTimeout);typewriterTimeout=null;}
  typewriterDone=false;
  el.innerHTML='<span class="caret"></span>';
  let i=0;
  const step=()=>{
    if(i>=typewriterFull.length){
      el.textContent=typewriterFull;
      typewriterDone=true;typewriterTimeout=null;return;
    }
    i++;
    el.innerHTML=escapeHtml(typewriterFull.slice(0,i))+'<span class="caret"></span>';
    typewriterTimeout=setTimeout(step,18);
  };
  step();
}
function skipTypewriter(){
  if(typewriterDone)return;
  if(typewriterTimeout){clearTimeout(typewriterTimeout);typewriterTimeout=null;}
  document.getElementById('scene-text').textContent=typewriterFull;
  typewriterDone=true;
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* =========================================================
   TIMER
   ========================================================= */
function startTimer(defaultNext){
  let rem=TIMER_SECONDS;
  timerWarned=false;
  const fill=document.getElementById('timer-fill');
  fill.classList.remove('warn');
  fill.style.width='100%';
  timerInterval=setInterval(()=>{
    rem--;
    fill.style.width=(rem/TIMER_SECONDS*100)+'%';
    if(rem<=5&&!timerWarned){timerWarned=true;fill.classList.add('warn');playSfx('warn');}
    if(rem<=0){
      clearInterval(timerInterval);timerInterval=null;
      choose(defaultNext);
    }
  },1000);
}

/* =========================================================
   CHOICE — with optional Reflection-Mode pause overlay
   ========================================================= */
function choose(next){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  playSfx('click');
  // Record journey step (only for branching scenes that have a choices array
  // matching this `next`; interactive scenes push their own step)
  const s=currentStory&&currentStory.scenes[currentSceneId];
  if(s&&Array.isArray(s.choices)){
    const c=s.choices.find(x=>x.next===next);
    if(c){
      journey.push({chapter:s.chapter||'',text:s.text||'',choice:c.text});
    }
  }
  const choicesWrap=document.getElementById('choices-wrap');
  choicesWrap.classList.add('hidden');
  const proceed=()=>{
    if(next==='ai'||next==='AI'){
      generateAIScene();
    }else{
      playScene(next);
    }
  };
  if(mode==='reflect'){
    showWWYD(proceed);
  }else{
    setTimeout(proceed,350);
  }
}

/* Choice handler for AI-generated scenes (looked up by index) */
function chooseAI(idx){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  playSfx('click');
  if(currentAIScene&&Array.isArray(currentAIScene.choices)){
    const c=currentAIScene.choices[idx];
    if(c){
      journey.push({chapter:currentAIScene.chapter||'',text:currentAIScene.text||'',choice:c.text});
    }
  }
  const choicesWrap=document.getElementById('choices-wrap');
  choicesWrap.classList.add('hidden');
  const proceed=()=>generateAIScene();
  if(mode==='reflect'){
    showWWYD(proceed);
  }else{
    setTimeout(proceed,350);
  }
}
function showWWYD(done){
  const ov=document.getElementById('wwyd-overlay');
  ov.classList.add('active');
  setTimeout(()=>{
    ov.classList.remove('active');
    setTimeout(done,300);
  },1500);
}

/* =========================================================
   ENDING
   ========================================================= */
function showEnding(s,endingId){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  recordEnding(currentStory.id,endingId);
  stopMusic();currentMood=null;
  playMusic(s.type&&s.type.toLowerCase().includes('best')?'victory':'calm');
  playSfx('reveal');
  document.getElementById('ending-emoji').textContent=s.emoji||'🎬';
  document.getElementById('ending-type').textContent=s.type||'Ending';
  document.getElementById('ending-title').textContent=s.title||'';
  document.getElementById('ending-text').textContent=s.text||'';
  document.getElementById('ending-lesson').textContent=s.lesson||'';
  const total=endingCount(currentStory);
  const found=discoveredCount(currentStory.id);
  const progEl=document.getElementById('ending-progress');
  if(currentStory.aiStory||total===0){
    progEl.textContent=`★ ${found} ${found===1?'path':'paths'} explored`;
  }else{
    progEl.textContent=`★ You've discovered ${found} of ${total} endings`;
  }
  const reflect=(s.reflect||[]).slice();
  if(mode==='reflect'){
    reflect.unshift("Pause for 30 seconds. Sit with the choice you just made.");
  }
  document.getElementById('reflect-list').innerHTML=reflect.map(q=>`<li>${q}</li>`).join('');
  showScreen('ending-screen');
}

/* =========================================================
   KEYBOARD
   ========================================================= */
document.addEventListener('keydown',e=>{
  if(!document.querySelector('#player-screen.active'))return;
  // Skip typewriter on space/enter
  if((e.key===' '||e.key==='Enter')&&!typewriterDone){
    // don't intercept Enter inside the interactive input
    if(document.activeElement&&document.activeElement.id==='ai-input')return;
    e.preventDefault();skipTypewriter();return;
  }
  // Submit interactive on Enter
  if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='ai-input'){
    const btn=document.querySelector('.interactive-submit');btn&&btn.click();return;
  }
  const btns=document.querySelectorAll('.choice-btn');
  const map={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
  const i=map[e.key.toLowerCase()];
  if(i!==undefined&&btns[i])btns[i].click();
});

/* =========================================================
   INIT
   ========================================================= */
setMode(mode);
document.getElementById('sound-toggle').textContent=soundOn?'🔊':'🔇';
document.getElementById('sound-toggle').classList.toggle('on',soundOn);
buildHome();

// Resume audio context on first user gesture (browser autoplay policy)
['click','touchstart','keydown'].forEach(ev=>{
  document.addEventListener(ev,function once(){
    const ctx=ensureAudio();
    if(ctx&&ctx.state==='suspended')ctx.resume();
    document.removeEventListener(ev,once);
  });
});
</script>
