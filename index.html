<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Choose Your Adventure</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#222}
.screen{display:none;position:fixed;inset:0;flex-direction:column}
.screen.active{display:flex}
#home-screen{background:linear-gradient(160deg,#1a1a2e,#16213e,#0f3460);align-items:center;justify-content:center;padding:24px}
.home-wrap{max-width:480px;width:100%;text-align:center}
.home-title{font-size:40px;font-weight:900;color:#fff;margin-bottom:6px;line-height:1.1}
.home-title span{background:linear-gradient(135deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-sub{color:#aac;font-size:16px;margin-bottom:32px}
.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.story-card{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.12);border-radius:16px;padding:18px 12px;cursor:pointer;transition:all 0.2s;text-align:center}
.story-card:hover{background:rgba(255,255,255,0.16);border-color:#ffd200;transform:translateY(-3px)}
.story-card .card-emoji{font-size:36px;margin-bottom:8px}
.story-card .card-title{color:#fff;font-size:14px;font-weight:700;margin-bottom:4px}
.story-card .card-theme{color:#ffd200;font-size:12px;text-transform:uppercase;letter-spacing:1px}
#player-screen{background:#000}
.scene-image{width:100%;height:40vh;object-fit:cover;flex-shrink:0;position:relative}
.scene-image img{width:100%;height:100%;object-fit:cover}
.scene-image-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,#111 100%)}
.scene-body{flex:1;overflow-y:auto;background:#111;padding:20px 20px 100px;display:flex;flex-direction:column}
.scene-chapter{font-size:11px;text-transform:uppercase;letter-spacing:3px;color:#ffd200;margin-bottom:10px}
.scene-text{font-size:19px;line-height:1.7;color:#eee;margin-bottom:24px;flex:1}
.choices-wrap{display:flex;flex-direction:column;gap:10px}
.choice-btn{padding:16px 18px;background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.15);border-radius:14px;color:#fff;font-size:16px;text-align:left;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:12px}
.choice-btn:hover,.choice-btn:active{background:rgba(255,210,0,0.15);border-color:#ffd200}
.choice-key{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;color:#ffd200}
.timer-track{height:5px;background:rgba(255,255,255,0.1);width:100%}
.timer-fill{height:100%;background:linear-gradient(90deg,#f7971e,#ffd200);transition:width 0.5s linear}
#ending-screen{background:linear-gradient(160deg,#0f3460,#16213e,#1a1a2e);align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.ending-wrap{max-width:480px;width:100%;text-align:center;padding:20px 0}
.ending-emoji{font-size:72px;margin-bottom:12px}
.ending-type{font-size:12px;text-transform:uppercase;letter-spacing:3px;color:#ffd200;margin-bottom:8px}
.ending-title{font-size:28px;font-weight:800;color:#fff;margin-bottom:12px}
.ending-text{font-size:17px;line-height:1.6;color:#bbb;margin-bottom:20px}
.ending-lesson{background:rgba(255,210,0,0.1);border:2px solid #ffd200;border-radius:14px;padding:16px;margin-bottom:24px}
.ending-lesson-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#ffd200;margin-bottom:6px}
.ending-lesson-text{font-size:16px;color:#fff;line-height:1.5}
.reflect-title{font-size:14px;text-transform:uppercase;letter-spacing:2px;color:#ffd200;margin-bottom:12px}
.reflect-list{list-style:none;margin-bottom:28px;text-align:left}
.reflect-list li{color:#ccc;font-size:15px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);padding-left:20px;position:relative}
.reflect-list li::before{content:'?';position:absolute;left:0;color:#ffd200;font-weight:700}
.ending-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.end-btn{padding:12px 24px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer}
.end-btn.primary{background:#ffd200;color:#111}
.end-btn.secondary{background:rgba(255,255,255,0.08);color:#ccc;border:2px solid rgba(255,255,255,0.15)}
@media(max-width:400px){.story-grid{grid-template-columns:1fr}.home-title{font-size:32px}.scene-text{font-size:17px}}
</style>
</head>
<body>
<div id="home-screen" class="screen active">
  <div class="home-wrap">
    <div class="home-title">Choose Your<br><span>Adventure</span></div>
    <p class="home-sub">Step into the story. Every choice matters.</p>
    <div class="story-grid" id="story-grid"></div>
  </div>
</div>
<div id="player-screen" class="screen">
  <div class="scene-image" id="scene-image-wrap">
    <img id="scene-img" src="" alt="">
    <div class="scene-image-overlay"></div>
  </div>
  <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
  <div class="scene-body">
    <div class="scene-chapter" id="scene-chapter"></div>
    <div class="scene-text" id="scene-text"></div>
    <div class="choices-wrap" id="choices-wrap"></div>
  </div>
</div>
<div id="ending-screen" class="screen">
  <div class="ending-wrap">
    <div class="ending-emoji" id="ending-emoji"></div>
    <div class="ending-type" id="ending-type"></div>
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-text" id="ending-text"></div>
    <div class="ending-lesson">
      <div class="ending-lesson-label">Life Lesson</div>
      <div class="ending-lesson-text" id="ending-lesson"></div>
    </div>
    <div class="reflect-title">Think About It</div>
    <ul class="reflect-list" id="reflect-list"></ul>
    <div class="ending-actions">
      <button class="end-btn primary" onclick="restartStory()">Play Again</button>
      <button class="end-btn secondary" onclick="goHome()">All Stories</button>
    </div>
  </div>
</div>
<script>
const STORIES=[{id:"david-goliath",title:"Face the Giant",theme:"Courage",emoji:"⚔️",category:"Bible",image:"https://images.unsplash.com/photo-1519074069444-1ba4fff66d16?w=800&q=80",scenes:{s1:{chapter:"Bible Story · 1 Samuel 17",text:"You are David, a young shepherd boy. Your brothers are soldiers in King Saul's army, and you've come to bring them food. Suddenly the whole camp goes silent. A giant named Goliath — nine feet tall and covered in armor — steps forward and shouts: 'Send someone to fight me! If he wins, we'll be your servants. If I win, YOU become ours!' Everyone trembles in fear. No soldier will move.",image:"https://images.unsplash.com/photo-1519074069444-1ba4fff66d16?w=800&q=80",choices:[{text:"Step forward and volunteer to fight Goliath",next:"s2a"},{text:"Stay quiet — you're just a kid, not a soldier",next:"s2b"},{text:"Go tell King Saul you have an idea",next:"s2c"}]},s2a:{chapter:"The Volunteer",text:"You walk forward boldly. The soldiers gasp. Your brother Eliab grabs your arm: 'Go home, David! This is too dangerous for you!' But you shake free. King Saul hears about you and calls you to his tent. He looks you up and down — you're just a boy with no armor. 'You can't fight him,' the king says. 'You have no training.'",image:"https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?w=800&q=80",choices:[{text:"Tell the king how God helped you fight lions and bears as a shepherd",next:"s3"},{text:"Agree and go back home",next:"end_poor"}]},s2b:{chapter:"Staying Back",text:"You step back into the crowd. Days pass. Every morning and evening Goliath comes out and shouts his challenge. Every time, the Israelite soldiers run away in fear. You watch, feeling something stir in your chest — anger, sadness, and something else. Maybe courage. A soldier next to you says the king has promised great rewards to whoever defeats Goliath.",image:"https://images.unsplash.com/photo-1474291102916-622af5ff5ce1?w=800&q=80",choices:[{text:"Change your mind — go speak to King Saul now",next:"s2a"},{text:"Keep watching and do nothing",next:"end_poor"}]},s2c:{chapter:"The Plan",text:"You go straight to King Saul's tent. Guards try to stop you, but you push through. 'Your Majesty,' you say, 'I have an idea.' The king looks surprised. You explain that as a shepherd you've fought lions and bears to protect your flock — and God helped you every time. The king listens carefully. He offers you his own armor and sword.",image:"https://images.unsplash.com/photo-1454496522488-7a8e488e8606?w=800&q=80",choices:[{text:"Try on the armor even though it is too big",next:"end_neutral"},{text:"Thank the king but trust your sling and five smooth stones instead",next:"s3"}]},s3:{chapter:"The Valley",text:"You walk into the valley alone. Goliath sees you and laughs out loud. 'Am I a dog, that you come at me with sticks? I will feed your body to the birds!' he roars. The whole battlefield goes quiet. Your heart pounds. In your pouch are five smooth stones from the stream. You grip your sling. This is the moment.",image:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80",choices:[{text:"Shout: 'You come with a sword, but I come in the name of the Lord!' and let the stone fly",next:"end_best"},{text:"Hesitate — look back at the soldiers watching you",next:"end_neutral"}]},end_best:{ending:true,type:"Best Ending",emoji:"🏆",title:"The Giant Falls",text:"The stone flies straight and true. It strikes Goliath right in the forehead — and the great giant crashes to the ground. A shout goes up from the Israelite army. You ran toward the battle instead of away from it, trusting not in your own strength but in God's. That day, one brave shepherd boy changed everything.",lesson:"Real courage is not the absence of fear — it is choosing to act despite fear, trusting that God is with you.",reflect:["When have you felt scared to do the right thing?","David trusted God more than he feared the giant. What do you put your trust in?","Who is a giant in your own life that you need courage to face?"]},end_neutral:{ending:true,type:"Neutral Ending",emoji:"🛡️",title:"Not Ready Yet",text:"You put on Saul's armor but it is so heavy you can barely walk. You take it off, confused about what to do next. Another soldier eventually fights Goliath — and loses. The battle is lost that day. You head home thinking about what might have been different if you had trusted your own gifts and God's help.",lesson:"God gives each of us unique gifts. Trying to be someone else instead of trusting who God made you to be can hold you back.",reflect:["David's gift was his sling and his faith — not a soldier's armor. What gifts has God given YOU?","Have you ever tried to copy someone else instead of being yourself?","What would it look like to trust your own strengths today?"]},end_poor:{ending:true,type:"Learning Ending",emoji:"🌱",title:"A Lesson Learned",text:"You walk away and go back home. The standoff with Goliath continues for forty more days. No one is brave enough to step forward. Later, you hear that a boy — just like you — from another village finally stood up and defeated the giant. You wonder: what would have happened if you had been brave enough to try?",lesson:"Doing nothing is still a choice. When we let fear stop us from acting, we miss the chance to do great things — and others miss out too.",reflect:["Is there something you have been too afraid to try?","What is the worst that could have happened if David had tried and failed?","What is one small brave thing you could do TODAY?"]}}}];
let currentStory=null,timerInterval=null;
const TIMER_SECONDS=40;
function buildHome(){document.getElementById('story-grid').innerHTML=STORIES.map(s=>'<div class="story-card" onclick="startStory(\''+s.id+'\')"><div class="card-emoji">'+s.emoji+'</div><div class="card-title">'+s.title+'</div><div class="card-theme">'+s.theme+'</div></div>').join('')}
function goHome(){if(timerInterval)clearInterval(timerInterval);showScreen('home-screen')}
function startStory(id){currentStory=STORIES.find(s=>s.id===id);if(!currentStory)return;showScreen('player-screen');playScene('s1')}
function restartStory(){if(!currentStory)return;showScreen('player-screen');playScene('s1')}
function playScene(id){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  const s=currentStory.scenes[id];if(!s)return;
  if(s.ending){showEnding(s);return}
  document.getElementById('scene-chapter').textContent=s.chapter||'';
  document.getElementById('scene-text').textContent=s.text;
  document.getElementById('scene-img').src=s.image||currentStory.image;
  const keys=['A','B','C'];
  document.getElementById('choices-wrap').innerHTML=s.choices.map((c,i)=>'<button class="choice-btn" onclick="choose(\''+c.next+'\')"><span class="choice-key">'+keys[i]+'</span>'+c.text+'</button>').join('');
  document.querySelector('.scene-body').scrollTop=0;
  let rem=TIMER_SECONDS;
  const fill=document.getElementById('timer-fill');
  fill.style.width='100%';
  timerInterval=setInterval(()=>{rem--;fill.style.width=(rem/TIMER_SECONDS*100)+'%';if(rem<=0){clearInterval(timerInterval);timerInterval=null;choose(s.choices[0].next)}},1000)
}
function choose(next){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  const w=document.getElementById('choices-wrap');w.style.opacity='0.3';
  setTimeout(()=>{w.style.opacity='1';playScene(next)},300)
}
function showEnding(s){
  document.getElementById('ending-emoji').textContent=s.emoji;
  document.getElementById('ending-type').textContent=s.type;
  document.getElementById('ending-title').textContent=s.title;
  document.getElementById('ending-text').textContent=s.text;
  document.getElementById('ending-lesson').textContent=s.lesson;
  document.getElementById('reflect-list').innerHTML=(s.reflect||[]).map(q=>'<li>'+q+'</li>').join('');
  showScreen('ending-screen')
}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
document.addEventListener('keydown',e=>{
  if(!document.querySelector('#player-screen.active'))return;
  const btns=document.querySelectorAll('.choice-btn');
  const map={a:0,b:1,c:2,'1':0,'2':1,'3':2};
  const i=map[e.key.toLowerCase()];
  if(i!==undefined&&btns[i])btns[i].click()
});
buildHome();
</script>
</body>
</html>
